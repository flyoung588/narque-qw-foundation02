name: QW-NEXT bounded import contrast and frozen W3 recovery once
on:
  workflow_dispatch:
    inputs:
      round:
        type: choice
        options: ['2']
        required: true
permissions:
  contents: read
concurrency:
  group: qw-next-single
  cancel-in-progress: false
jobs:
  experiment:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build environment without persistent cache
        run: timeout --kill-after=5s 200s docker build --pull --no-cache -f qw_next/Dockerfile -t qw-next:once .
      - name: Run one bounded observation round
        env:
          ROUND: ${{ inputs.round }}
        run: python3 qw_next/host.py
      - name: Preserve partial or complete evidence
        if: always()
        run: python3 cloud/export_logs.py "$RUNNER_TEMP/qw-next-results"
