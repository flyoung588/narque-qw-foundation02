# PREPARED SOURCE ONLY — must not be published/dispatched without new P02 scope.
name: QW PERIODIC03 bounded KRKS sampling contrast
on:
  workflow_dispatch:
    inputs:
      round:
        type: choice
        options: ['2']
        required: true
permissions:
  contents: read
concurrency:
  group: periodic03-once
  cancel-in-progress: false
jobs:
  bounded-periodic:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build bounded isolated periodic environment without persistent cache
        run: timeout --kill-after=5s 210s docker build --pull --no-cache -f periodic03/Dockerfile -t periodic03:once .
      - name: Run at most one candidate in offline science container
        run: python3 -B periodic03/host.py
      - name: Preserve partial or complete raw evidence
        if: always()
        run: python3 -B cloud/export_logs.py "$RUNNER_TEMP/periodic03-results"
