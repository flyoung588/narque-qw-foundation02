# LOCAL PREPARATION ONLY: new Human scope required before publication/dispatch.
name: QW PHYSICS FRONTIER01 bounded correlated-electron stage
on:
  workflow_dispatch:
    inputs:
      round:
        type: choice
        options: ['1', '2']
        required: true
permissions:
  contents: read
concurrency:
  group: physics-frontier01-once
  cancel-in-progress: false
jobs:
  bounded-periodic:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build bounded isolated periodic environment without persistent cache
        env:
          REQUESTED_STAGE: ${{ inputs.round }}
        run: |
          python3 -c 'import json,os; r=json.load(open("frontier01/REQUEST.json")); assert str(r["stage"])==os.environ["REQUESTED_STAGE"]'
          timeout --kill-after=5s 210s docker build --pull --no-cache -f frontier01/Dockerfile -t frontier01:once .
      - name: Run at most one candidate in offline science container
        run: python3 -B frontier01/host.py
      - name: Preserve partial or complete raw evidence
        if: always()
        run: python3 -B cloud/export_logs.py "$RUNNER_TEMP/frontier01-results"
