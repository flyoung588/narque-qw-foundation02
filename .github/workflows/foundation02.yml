name: Foundation02R one isolated PySCF feedback experiment
on:
  workflow_dispatch:
    inputs:
      round:
        type: choice
        options: ['2']
        required: true
permissions:
  contents: read
concurrency:
  group: foundation02r-single
  cancel-in-progress: false
jobs:
  experiment:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build environment without persistent cache
        run: timeout --kill-after=5s 200s docker build --pull --no-cache -f recovery02r/Dockerfile -t foundation02r:once .
      - name: Run one bounded observation round
        env:
          ROUND: ${{ inputs.round }}
        run: python3 recovery02r/host.py
      - name: Preserve partial or complete evidence
        if: always()
        run: python3 cloud/export_logs.py "$RUNNER_TEMP/foundation02r-results"
